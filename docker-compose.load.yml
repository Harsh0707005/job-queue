# Lease load test: 20 tenants × thousands of jobs, fair multi-tenant drain.
#
# Baseline (Python lease path):
#   docker compose -f docker-compose.yml -f docker-compose.load.yml down -v --remove-orphans
#   docker compose -f docker-compose.yml -f docker-compose.load.yml build
#   docker compose -f docker-compose.yml -f docker-compose.load.yml \
#     up --abort-on-container-exit --exit-code-from load-soak load-soak
#
# Optimized (Go lease + Postgres tuning) — use docker-compose.load-go.yml overlay too.

x-batch-worker: &batch_worker_env
  COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
  POLL_INTERVAL: "0.05"
  VISIBILITY_TIMEOUT: "30"
  BATCH_SIZE: "32"
  LOG_LEVEL: WARNING

services:
  chaos:
    profiles: ["disabled"]
  soak:
    profiles: ["disabled"]

  # Mild baseline postgres (no special tuning yet).
  postgres:
    command:
      - postgres
      - -c
      - max_connections=200

  worker-1:
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w1
  worker-2:
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w2
  worker-3:
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w3
  worker-4:
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w4

  worker-5:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w5
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-6:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w6
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-7:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w7
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-8:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      <<: *batch_worker_env
      WORKER_ID: load-w8
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  # Disable schedule/webhook noise for pure lease load.
  scheduler:
    profiles: ["disabled"]
  webhook-1:
    profiles: ["disabled"]
  webhook-2:
    profiles: ["disabled"]
  webhook-sink:
    profiles: ["disabled"]

  load-soak:
    build: .
    command: ["python", "scripts/load_lease_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      LEASE_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "20"
      JOBS_PER_TENANT: "250"
      ENQUEUE_WORKERS: "20"
      MAX_WALL_SECONDS: "600"
      POLL_SECONDS: "1"
      LOAD_LABEL: baseline-python
      RESULTS_PATH: /results/baseline-python.json
      LOG_LEVEL: INFO
    volumes:
      - ./deploy/load-results:/results
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      worker-7:
        condition: service_started
      worker-8:
        condition: service_started
