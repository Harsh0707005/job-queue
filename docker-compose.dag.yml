# Atomic DAG enqueue under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.dag.yml \
#     up --build --abort-on-container-exit --exit-code-from dag-soak dag-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  dag-soak:
    build: .
    command: ["python", "scripts/dag_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "6"
      DAGS_PER_TENANT: "4"
      DUP_SUBMITS: "4"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
