# Dynamic workflow map fan-out under a multi-tenant multi-worker fleet.
#
#   docker compose -f docker-compose.yml -f docker-compose.workflow.yml \
#     -f docker-compose.workflow-map.yml \
#     up --build --abort-on-container-exit --exit-code-from workflow-map-soak \
#     workflow-map-soak

services:
  chaos:
    profiles: ["disabled"]
  soak:
    profiles: ["disabled"]
  scheduler:
    profiles: ["disabled"]
  workflow-soak:
    profiles: ["disabled"]

  workflow-map-soak:
    build: .
    command: ["python", "scripts/workflow_map_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      EFFECT_SINK_URL: http://effect-sink:8091
      MAP_TENANTS: "3"
      MAP_HAPPY: "3"
      MAP_ITEMS: "6"
      MAP_CANCEL: "2"
      MAP_FAIL: "2"
      MAP_HUGE_ITEMS: "4000"
      MAP_MAX_ITEMS: "8"
      MAX_WALL_SECONDS: "240"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      effect-sink:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      worker-7:
        condition: service_started
      worker-8:
        condition: service_started
