# Live priority bump/drop under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.priority-change.yml \
#     up --build --abort-on-container-exit --exit-code-from priority-change-soak \
#     priority-change-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  priority-change-soak:
    build: .
    command: ["python", "scripts/priority_change_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      LOW_EACH: "50"
      BUMP_EACH: "16"
      JOB_MS: "80"
      MID_MIN: "16"
      MID_MAX: "28"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
