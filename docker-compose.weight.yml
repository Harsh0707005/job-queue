# Weighted fair lease under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.weight.yml \
#     up --build --abort-on-container-exit --exit-code-from weight-soak \
#     weight-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  weight-soak:
    build: .
    command: ["python", "scripts/weight_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      JOBS_EACH: "60"
      JOB_MS: "80"
      MID_MIN: "80"
      MID_MAX: "160"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
