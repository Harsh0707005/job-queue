# Signed inbound HTTP triggers on the multi-tenant fleet.
#
#   COMPOSE_PROJECT_NAME=jq-inbound docker compose -p jq-inbound \
#     -f docker-compose.yml -f docker-compose.inbound-triggers.yml up --build -d
#   docker logs -f jq-inbound-inbound-trigger-soak-1

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  postgres:
    ports: !reset []
  webhook-sink:
    ports: !reset []
  coordinator-1:
    ports: !reset []
  coordinator-2:
    ports: !reset []

  inbound-trigger-soak:
    build: .
    command: ["python", "scripts/inbound_trigger_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "4"
      JOBS_PER_TENANT: "40"
      DAGS_PER_TENANT: "4"
      WORKFLOWS_PER_TENANT: "3"
      CONCURRENCY: "8"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    volumes:
      - ./scripts:/app/scripts
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      postgres:
        condition: service_healthy
