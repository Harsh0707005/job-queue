# Cancel-running soak on dual-coordinator fleet with slow jobs.
#
#   docker compose -f docker-compose.yml -f docker-compose.cancel.yml \
#     up --build --abort-on-container-exit --exit-code-from cancel-soak cancel-soak

services:
  chaos:
    profiles: ["chaos-only"]
  soak:
    profiles: ["chaos-only"]

  worker-1:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "60"
      LOG_LEVEL: INFO

  worker-2:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "60"
      LOG_LEVEL: INFO

  worker-3:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "60"
      LOG_LEVEL: INFO

  worker-4:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "60"
      LOG_LEVEL: INFO

  cancel-soak:
    build: .
    command: ["python", "scripts/cancel_running_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "4"
      SLOW_PER_TENANT: "6"
      FAST_PER_TENANT: "4"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
