# Large payload/result spill: shared blob volume + a starved Postgres.
#
#   docker compose -f docker-compose.yml -f docker-compose.payload-blobs.yml \
#     up --build --abort-on-container-exit --exit-code-from payload-blobs-soak \
#     payload-blobs-soak

x-blob-env: &blob_env
  JOB_QUEUE_BLOB_DIR: /var/lib/job-queue/blobs
  JOB_QUEUE_PAYLOAD_BLOB_THRESHOLD: "2048"

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - work_mem=512kB
      - -c
      - maintenance_work_mem=4MB
      - -c
      - effective_cache_size=32MB
      - -c
      - wal_buffers=1MB
      - -c
      - max_connections=80

  coordinator-1:
    environment:
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      COORDINATOR_NODE: coordinator-1
      LOG_LEVEL: INFO
      JOB_QUEUE_ALLOW_PRIVATE_WEBHOOKS: "1"
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      <<: *blob_env
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs

  coordinator-2:
    environment:
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      COORDINATOR_NODE: coordinator-2
      LOG_LEVEL: INFO
      JOB_QUEUE_ALLOW_PRIVATE_WEBHOOKS: "1"
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      <<: *blob_env
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs

  payload-blobs-soak:
    build: .
    command: ["python", "scripts/payload_blob_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      JOB_QUEUE_ALLOW_PRIVATE_WEBHOOKS: "1"
      <<: *blob_env
      TENANTS: "6"
      JOBS_PER_TENANT: "30"
      PAYLOAD_BYTES: "98304"
      MAX_WALL_SECONDS: "360"
      SECRET_PREFIX: blob-secret
      WEBHOOK_URL: http://webhook-sink:8090/hook
      LOG_LEVEL: INFO
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      webhook-sink:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  payload-blobs:
