# Concurrent clones of the same source across a multi-coordinator fleet.
#
#   docker compose -f docker-compose.yml -f docker-compose.clone-race.yml \
#     up --build --abort-on-container-exit --exit-code-from clone-race-soak \
#     clone-race-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  clone-race-soak:
    build: .
    command: ["python", "scripts/clone_race_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      CLONES_EACH: "40"
      RACE_THREADS: "20"
      JOB_MS: "20"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
