# Tenant failure breaker under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.breaker.yml \
#     up --build --abort-on-container-exit --exit-code-from breaker-soak \
#     breaker-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  breaker-soak:
    build: .
    command: ["python", "scripts/breaker_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      HEALTHY_TENANTS: "4"
      POISON_EACH: "30"
      HEALTHY_EACH: "16"
      EXTRA_HEALTHY: "8"
      EXTRA_POISON: "10"
      BREAKER_THRESHOLD: "8"
      BREAKER_WINDOW_SECONDS: "120"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
