# Split matching live schedules (including a mid-tick workflow) to dest.
#
#   docker compose -f docker-compose.yml -f docker-compose.workflow.yml \
#     -f docker-compose.tenant-split-schedule.yml down -v --remove-orphans
#   docker compose -f docker-compose.yml -f docker-compose.workflow.yml \
#     -f docker-compose.tenant-split-schedule.yml up --build \
#     --abort-on-container-exit --exit-code-from tenant-split-sched-soak \
#     tenant-split-sched-soak

services:
  workflow-soak:
    profiles: ["disabled"]

  worker-1:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-2:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-3:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-4:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-5:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-6:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-7:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
  worker-8:
    environment:
      QUEUE_NAME: default,email
      WORKFLOW_ALLOW_SINK_FAILURE: "1"

  tenant-split-sched-soak:
    build: .
    command: ["python", "scripts/tenant_split_schedule_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      EFFECT_SINK_URL: http://effect-sink:8091
      PAIRS: "2"
      OTHERS: "2"
      KEEP_JOBS: "8"
      MAX_WALL_SECONDS: "240"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      effect-sink:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      worker-7:
        condition: service_started
      worker-8:
        condition: service_started
