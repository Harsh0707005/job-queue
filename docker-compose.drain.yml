# Graceful worker drain on deploy/shutdown.
#
#   docker compose -f docker-compose.yml -f docker-compose.drain.yml \
#     up --build --abort-on-container-exit --exit-code-from drain-soak drain-soak

services:
  soak:
    profiles: ["off"]
  chaos:
    profiles: ["off"]

  worker-1: &w
    stop_grace_period: 45s
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "60"
      DRAIN_TIMEOUT: "5"
      LOG_LEVEL: INFO
  worker-2:
    <<: *w
    stop_grace_period: 45s
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "60"
      DRAIN_TIMEOUT: "5"
      LOG_LEVEL: INFO
  worker-3:
    <<: *w
    stop_grace_period: 45s
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "60"
      DRAIN_TIMEOUT: "5"
      LOG_LEVEL: INFO
  worker-4:
    <<: *w
    stop_grace_period: 45s
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "2"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "60"
      DRAIN_TIMEOUT: "5"
      LOG_LEVEL: INFO

  drain-soak:
    image: docker:27-cli
    working_dir: /work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/work
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Python for the soak script (docker:cli is alpine).
        apk add --no-cache python3 py3-pip >/dev/null
        python3 scripts/drain_soak.py
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-job-queue}
      VISIBILITY_TIMEOUT: "60"
      DRAIN_TIMEOUT: "5"
      LONG_MS: "8000"
      JOBS: "10"
      MAX_WALL_SECONDS: "90"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
