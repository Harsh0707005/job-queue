# In-place tenant transfer under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.tenant-move.yml \
#     up --build --abort-on-container-exit --exit-code-from tenant-move-soak \
#     tenant-move-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  tenant-move-soak:
    build: .
    command: ["python", "scripts/tenant_move_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      SEED_EACH: "20"
      CONTROL_EACH: "6"
      JOB_MS: "25"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
