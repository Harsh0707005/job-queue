# Load-test rebuild-from-audit on a multi-container fleet.
#
#   docker compose -f docker-compose.yml -f docker-compose.rebuild.yml \
#     up --build --abort-on-container-exit --exit-code-from rebuild-soak rebuild-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  worker-1: &w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "6"
      POLL_INTERVAL: "0.15"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-2:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "6"
      POLL_INTERVAL: "0.15"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-3:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "6"
      POLL_INTERVAL: "0.15"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-4:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "6"
      POLL_INTERVAL: "0.15"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO

  rebuild-soak:
    build: .
    command: ["python", "scripts/rebuild_load_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      TENANTS: "10"
      JOBS_PER_TENANT: "30"
      DELETE_FRACTION: "0.6"
      MAX_WALL_SECONDS: "240"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
