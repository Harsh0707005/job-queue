# Per-job freeze under multi-tenant multi-worker load.
#
#   docker compose -f docker-compose.yml -f docker-compose.freeze.yml \
#     up --build --abort-on-container-exit --exit-code-from freeze-soak \
#     freeze-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  freeze-soak:
    build: .
    command: ["python", "scripts/freeze_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      HEALTHY_TENANTS: "3"
      HEALTHY_EACH: "16"
      FREEZE_EACH: "20"
      HOLD_EACH: "8"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
