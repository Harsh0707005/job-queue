# Cron schedule load soak under pending/rate throttles.
#
#   docker compose -f docker-compose.yml -f docker-compose.cron.yml \
#     up --build --abort-on-container-exit --exit-code-from cron-soak cron-soak

services:
  soak:
    profiles: ["off"]

  # Extra scheduler for dual-ticker load under SKIP LOCKED.
  scheduler-2:
    build: .
    command: ["job-queue-scheduler-node"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      POLL_INTERVAL: "0.3"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-1: &w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO
  worker-2:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO
  worker-3:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO
  worker-4:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO

  worker-5:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-5
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-6:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-6
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "20"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  chaos:
    profiles: ["off"]

  cron-soak:
    build: .
    command: ["python", "scripts/cron_schedule_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "12"
      SCHEDULES_PER_TENANT: "4"
      CRON_EVERY_SEC: "3"
      ENQUEUE_RATE: "0.5"
      ENQUEUE_BURST: "1"
      RUN_SECONDS: "40"
      MAX_WALL_SECONDS: "150"
      MIN_COMPLETED: "60"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      scheduler:
        condition: service_started
      scheduler-2:
        condition: service_started
