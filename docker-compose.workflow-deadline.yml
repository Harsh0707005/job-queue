# Workflow run deadlines on the multi-worker multi-tenant fleet.
#
#   COMPOSE_PROJECT_NAME=jq-wfdead docker compose -p jq-wfdead \
#     -f docker-compose.yml -f docker-compose.workflow.yml \
#     -f docker-compose.workflow-deadline.yml up --build -d
#   docker logs -f jq-wfdead-workflow-deadline-soak-1

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]
  scheduler:
    profiles: ["off"]
  workflow-soak:
    profiles: ["off"]

  postgres:
    ports: !reset []
  webhook-sink:
    ports: !reset []
  coordinator-1:
    ports: !reset []
  coordinator-2:
    ports: !reset []

  worker-1:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-2:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-3:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-4:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-5:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-6:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-7:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"
  worker-8:
    environment:
      WORKFLOW_ALLOW_SINK_FAILURE: "1"
      VISIBILITY_TIMEOUT: "4"

  workflow-deadline-soak:
    build: .
    command: ["python", "scripts/workflow_deadline_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      EFFECT_SINK_URL: http://effect-sink:8091
      TENANTS: "4"
      HAPPY_PER_TENANT: "3"
      SLEEP_PER_TENANT: "3"
      APPROVE_PER_TENANT: "2"
      FAN_PER_TENANT: "2"
      DEADLINE_SECONDS: "2"
      MAX_WALL_SECONDS: "240"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-jq-wfdead}
      LOG_LEVEL: INFO
    volumes:
      - ./scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      effect-sink:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      worker-7:
        condition: service_started
      worker-8:
        condition: service_started
