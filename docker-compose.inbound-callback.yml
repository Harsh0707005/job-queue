# Inbound job callbacks + tenant webhooks under fleet chaos.
#
#   COMPOSE_PROJECT_NAME=jq-incb docker compose -p jq-incb \
#     -f docker-compose.yml -f docker-compose.inbound-callback.yml up --build -d
#   docker logs -f jq-incb-inbound-callback-soak-1

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  postgres:
    ports: !reset []
  webhook-sink:
    ports: !reset []
    environment:
      LOG_LEVEL: INFO
      SLOW_MS: "80"
      WEBHOOK_VERIFY_SECRETS: "secret-inb-00-xxxxxxxx,secret-inb-01-xxxxxxxx,secret-inb-02-xxxxxxxx,secret-inb-03-xxxxxxxx,tenant-hook-secret"
  coordinator-1:
    ports: !reset []
  coordinator-2:
    ports: !reset []

  inbound-callback-soak:
    build: .
    command: ["python", "scripts/inbound_callback_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      SINK_URL: http://webhook-sink:8090
      CALLBACK_URL: http://webhook-sink:8090/hook
      WEBHOOK_URL: http://webhook-sink:8090/hook
      TENANTS: "4"
      JOBS_PER_TENANT: "16"
      DEAD_PER_TENANT: "3"
      CONCURRENCY: "6"
      MAX_WALL_SECONDS: "180"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-jq-incb}
      LOG_LEVEL: INFO
    volumes:
      - ./scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      webhook-1:
        condition: service_started
      webhook-2:
        condition: service_started
      webhook-sink:
        condition: service_healthy
      postgres:
        condition: service_healthy
