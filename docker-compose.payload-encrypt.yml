# Per-tenant payload encryption + live DEK rotation fleet soak.
#
#   docker compose -f docker-compose.yml -f docker-compose.payload-encrypt.yml \
#     up --build --abort-on-container-exit --exit-code-from payload-encrypt-soak \
#     payload-encrypt-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  payload-encrypt-soak:
    build: .
    command: ["python", "scripts/payload_encrypt_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      TENANTS: "4"
      JOBS_PER_TENANT: "20"
      MAX_WALL_SECONDS: "180"
      SECRET_PREFIX: tenant-secret
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      postgres:
        condition: service_healthy
