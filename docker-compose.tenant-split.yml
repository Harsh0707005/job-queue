# Tenant split fleet soak (stage via SPLIT_STAGE).
#
#   docker compose -f docker-compose.yml -f docker-compose.tenant-split.yml \
#     up --build --abort-on-container-exit --exit-code-from tenant-split-soak \
#     tenant-split-soak

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  worker-1:
    environment:
      QUEUE_NAME: default,email
  worker-2:
    environment:
      QUEUE_NAME: default,email
  worker-3:
    environment:
      QUEUE_NAME: default,email
  worker-4:
    environment:
      QUEUE_NAME: default,email

  tenant-split-soak:
    build: .
    command: ["python", "scripts/tenant_split_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      SPLIT_STAGE: "1"
      EMAIL_EACH: "16"
      KEEP_EACH: "8"
      JOB_MS: "25"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
