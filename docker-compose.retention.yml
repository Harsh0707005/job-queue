# Terminal job retention cleaner under multi-tenant load.
#
#   docker compose -f docker-compose.yml -f docker-compose.retention.yml \
#     up --build --abort-on-container-exit --exit-code-from retention-soak retention-soak

services:
  soak:
    profiles: ["off"]

  chaos:
    profiles: ["off"]

  cleaner-1:
    build: .
    command: ["job-queue-cleaner-node"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      POLL_INTERVAL: "2"
      BATCH_LIMIT: "200"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  cleaner-2:
    build: .
    command: ["job-queue-cleaner-node"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      POLL_INTERVAL: "2"
      BATCH_LIMIT: "200"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-1: &w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-2:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-3:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
  worker-4:
    <<: *w
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO

  worker-5:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-5
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  worker-6:
    build: .
    command: ["job-queue-worker-agent"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-6
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.1"
      VISIBILITY_TIMEOUT: "15"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy

  retention-soak:
    build: .
    command: ["python", "scripts/retention_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "10"
      JOBS_PER_TENANT: "20"
      DEAD_FRACTION: "0.2"
      COMPLETED_RETENTION_SECONDS: "8"
      DEAD_RETENTION_SECONDS: "8"
      MAX_WALL_SECONDS: "180"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      worker-5:
        condition: service_started
      worker-6:
        condition: service_started
      cleaner-1:
        condition: service_started
      cleaner-2:
        condition: service_started
