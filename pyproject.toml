[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-queue"
version = "0.1.0"
description = "Multi-tenant job queue with lease, heartbeat, and visibility timeout"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.1",
    "croniter>=2.0",
]

[project.scripts]
job-queue = "job_queue.cli:main"
job-queue-coordinator = "job_queue.coordinator:main"
job-queue-worker-agent = "job_queue.remote:worker_main"
job-queue-scheduler-node = "job_queue.remote:scheduler_main"
job-queue-webhook-node = "job_queue.remote:webhook_main"
job-queue-webhook-sink = "job_queue.webhook_sink:main"
job-queue-effect-sink = "job_queue.effect_sink:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "testcontainers[postgres]>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_queue"]

[tool.hatch.build.targets.sdist]
include = ["src/job_queue", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
pythonpath = ["src"]
