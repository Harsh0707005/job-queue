# Shared blob store on a 3-coordinator HA fleet.
# Enqueue on one node, lease/rotate/export/restore on another; kill the
# leader mid-flight. Workers keep completing spilled jobs.
#
# Do not use --abort-on-container-exit: the soak kills the leader on purpose.
#
#   COMPOSE_PROJECT_NAME=jq-pblob-ha docker compose -p jq-pblob-ha \
#     -f docker-compose.yml -f docker-compose.coordinator-leader.yml \
#     -f docker-compose.payload-blob-ha.yml up --build -d
#   docker logs -f jq-pblob-ha-payload-blob-ha-soak-1

x-blob-env: &blob_env
  JOB_QUEUE_BLOB_DIR: /var/lib/job-queue/blobs
  JOB_QUEUE_PAYLOAD_BLOB_THRESHOLD: "2048"
  JOB_QUEUE_BLOB_READ_RETRIES: "20"
  JOB_QUEUE_BLOB_READ_RETRY_SECONDS: "0.05"

services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]
  leader-soak:
    profiles: ["disabled"]

  # Host 5433 is the unit-test Postgres; soak talks to this instance in-network.
  postgres:
    ports: !reset []

  coordinator-1:
    environment:
      <<: *blob_env
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs
  coordinator-2:
    environment:
      <<: *blob_env
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs
  coordinator-3:
    environment:
      <<: *blob_env
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs

  payload-blob-ha-soak:
    build: .
    command: ["python", "scripts/payload_blob_ha_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080,http://coordinator-3:8080
      JOB_QUEUE_DSN: postgresql://queue:queue@postgres:5432/queue
      JOB_QUEUE_PAYLOAD_KEK: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      JOB_QUEUE_PAYLOAD_KEK_ID: fleet
      JOB_QUEUE_ALLOW_PRIVATE_WEBHOOKS: "1"
      <<: *blob_env
      TENANTS: "4"
      JOBS_PER_TENANT: "12"
      PAYLOAD_BYTES: "49152"
      MAX_WALL_SECONDS: "300"
      WEBHOOK_URL: http://webhook-sink:8090/hook
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-jq-pblob-ha}
      LOG_LEVEL: INFO
    volumes:
      - payload-blobs:/var/lib/job-queue/blobs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/app/scripts
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      coordinator-3:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
      webhook-sink:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  payload-blobs:
