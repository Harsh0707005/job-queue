services:
  chaos:
    profiles: ["off"]
  soak:
    profiles: ["off"]

  worker-1:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-1
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "30"
      LOG_LEVEL: INFO
  worker-2:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-2
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "30"
      LOG_LEVEL: INFO
  worker-3:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-3
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "30"
      LOG_LEVEL: INFO
  worker-4:
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      WORKER_ID: worker-4
      BATCH_SIZE: "4"
      POLL_INTERVAL: "0.2"
      VISIBILITY_TIMEOUT: "30"
      LOG_LEVEL: INFO

  max-runtime-soak:
    build: .
    command: ["python", "scripts/max_runtime_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      JOBS: "20"
      MAX_RUNTIME_SECONDS: "2"
      SLEEP_MS: "15000"
      MAX_WALL_SECONDS: "90"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
