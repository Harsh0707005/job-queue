# Priority-lane distributed soak (extends dual-coordinator fleet).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.priority.yml \
#     up --build --abort-on-container-exit --exit-code-from priority-soak priority-soak
#   docker compose -f docker-compose.yml -f docker-compose.priority.yml down -v

services:
  # Disable chaos/soak from base file when using this overlay by not starting them.
  chaos:
    profiles: ["chaos-only"]
  soak:
    profiles: ["chaos-only"]

  priority-soak:
    build: .
    command: ["python", "scripts/priority_soak.py"]
    environment:
      COORDINATOR_URLS: http://coordinator-1:8080,http://coordinator-2:8080
      TENANTS: "6"
      HIGH_PER_TENANT: "12"
      LOW_PER_TENANT: "8"
      HIGH_PRIORITY: "100"
      LOW_PRIORITY: "1"
      MAX_WALL_SECONDS: "600"
      POLL_SECONDS: "1"
      LOG_LEVEL: INFO
    depends_on:
      coordinator-1:
        condition: service_healthy
      coordinator-2:
        condition: service_healthy
      worker-1:
        condition: service_started
      worker-2:
        condition: service_started
      worker-3:
        condition: service_started
      worker-4:
        condition: service_started
